{#
  Conversations page (spec §8.1, §8.2).
  Two-column layout: left list sidebar + right main area.
  No custom JavaScript — all interactivity via HTMX + CSS.
#}
<div id="conversationsPage" class="flex-1 flex flex-col md:flex-row min-h-0 overflow-hidden">

  <!-- ── Left: conversation-list sidebar (spec §8.3) ── -->
  <div class="w-full md:w-72 shrink-0 flex flex-col border-b md:border-b-0 md:border-r border-slate-200 bg-white max-h-56 md:max-h-full overflow-y-auto md:overflow-y-auto">

    <!-- Sidebar header -->
    <div class="px-4 pt-4 pb-3 border-b border-slate-100 shrink-0">

      <!-- Title row + new chat -->
      <div class="flex items-center justify-between mb-3">
        <p class="text-xs font-semibold uppercase tracking-wider text-slate-400">Conversations</p>
        <button
          hx-get="/conversations/new"
          hx-target="#conversationMain"
          hx-swap="innerHTML"
          class="flex items-center gap-1 text-xs font-medium text-slate-600 hover:text-slate-900 bg-slate-100 hover:bg-slate-200 rounded px-2 py-1 transition-colors"
        >
          <svg xmlns="http://www.w3.org/2000/svg" class="w-3 h-3" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M19 13H13V19H11V13H5V11H11V5H13V11H19V13Z"/>
          </svg>
          New chat
        </button>
      </div>

      <!-- Search -->
      <div class="flex items-center gap-2 bg-slate-50 border border-slate-200 rounded px-2.5 py-1.5 mb-2 focus-within:border-slate-400 transition-colors">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-3 h-3 text-slate-400 shrink-0" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M9.5 3A6.5 6.5 0 0 1 16 9.5c0 1.61-.59 3.09-1.56 4.23l.27.27h.79l5 5-1.5 1.5-5-5v-.79l-.27-.27A6.516 6.516 0 0 1 9.5 16 6.5 6.5 0 0 1 3 9.5 6.5 6.5 0 0 1 9.5 3m0 2C7 5 5 7 5 9.5S7 14 9.5 14 14 12 14 9.5 12 5 9.5 5Z"/>
        </svg>
        <input
          type="text"
          name="q"
          placeholder="Search conversations…"
          class="flex-1 min-w-0 text-xs text-slate-700 placeholder-slate-400 bg-transparent border-none outline-none"
          hx-get="/conversations/list"
          hx-trigger="input changed delay:400ms, search"
          hx-target="#conversationList"
          hx-swap="innerHTML"
          hx-include="[name='agent']"
        />
      </div>

      <!-- Agent filter — options driven by the dynamic `agents` list from server.py -->
      <select
        name="agent"
        class="w-full text-xs text-slate-600 bg-slate-50 border border-slate-200 rounded px-2 py-1.5 outline-none cursor-pointer hover:border-slate-300 focus:border-slate-400 transition-colors"
        hx-get="/conversations/list"
        hx-target="#conversationList"
        hx-swap="innerHTML"
        hx-include="[name='q']"
        hx-trigger="change"
      >
        <option value="">All agents</option>
        {% for a in agents %}
        <option value="{{ a }}">{{ a }}</option>
        {% endfor %}
      </select>

    </div>

    <!-- Conversation list — loaded on page load -->
    <div
      id="conversationList"
      hx-get="/conversations/list"
      hx-trigger="load"
      hx-swap="innerHTML"
      class="flex-1 overflow-y-auto divide-y divide-slate-100"
    >
      <!-- Skeleton while loading -->
      <div class="px-4 py-3 space-y-3">
        <div class="animate-pulse h-3 bg-slate-100 rounded w-full"></div>
        <div class="animate-pulse h-3 bg-slate-100 rounded w-4/5"></div>
        <div class="animate-pulse h-3 bg-slate-100 rounded w-3/5"></div>
        <div class="animate-pulse h-3 bg-slate-100 rounded w-full"></div>
        <div class="animate-pulse h-3 bg-slate-100 rounded w-4/5"></div>
      </div>
    </div>

  </div>

  <!-- ── Right: main area (spec §8.4) — shows analytics on landing ── -->
  <div
    id="conversationMain"
    hx-get="/conversations/stats"
    hx-trigger="load"
    hx-swap="innerHTML"
    class="flex-1 overflow-y-auto bg-slate-50"
  >
    <!-- Skeleton while loading stats -->
    <div class="px-8 py-6 space-y-5">
      <div class="animate-pulse h-3 bg-slate-200 rounded w-32"></div>
      <div class="grid grid-cols-3 gap-4">
        <div class="animate-pulse h-24 bg-white border border-slate-200 rounded-lg"></div>
        <div class="animate-pulse h-24 bg-white border border-slate-200 rounded-lg"></div>
        <div class="animate-pulse h-24 bg-white border border-slate-200 rounded-lg"></div>
      </div>
      <div class="animate-pulse h-36 bg-white border border-slate-200 rounded-lg"></div>
      <div class="animate-pulse h-24 bg-white border border-slate-200 rounded-lg"></div>
    </div>
  </div>

</div>
